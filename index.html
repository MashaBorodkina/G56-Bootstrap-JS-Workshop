<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Workshop Bootstrap TODO</title>
    <link rel="stylesheet" href="assets/css/bootstrap.min.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
    />
    <link rel="stylesheet" href="assets/css/custom.css" />
    <script src="assets/js/bootstrap.bundle.min.js"></script>
  </head>
  <body class="color bg-light">
    <form class="mb-4">
      <div class="container my-3">
        <h1 class="text-center mb-4 color-dark">My Do App</h1>
        <div
          class="container-fluid my-4 px-2 pb-2 bg-white shadow-sm rounded-1 border border-2"
        >
          <div class="title-row my-1 mx-0">
            <label for="title" class="form-label">Title</label>
            <input
              id="title"
              name="title"
              type="text"
              class="form-control rounded-1"
            />
          </div>

          <div class="description-row my-1 mx-0">
            <label for="description" class="form-label">Description</label>
            <textarea
              id="description"
              name="description"
              class="form-control rounded-1"
              rows="3"
            ></textarea>
          </div>

          <div class="row">
            <div class="col-md-6">
              <label for="due date" class="form-label">Due Date</label>
              <div class="input-group">
                <input
                  type="datetime-local"
                  id="due-date"
                  name="dueDate"
                  class="date-time-picker form-control rounded-1"
                  required
                />               
              </div>
            </div>

            <div class="col-md-6">
              <label for="assign" class="form-label">Assign To</label>
              <select
                id="assign"
                name="assign"
                class="form-select rounded-1"
                required
              >
                <option value="" selected disabled>
                  --Select Person (Optional)--
                </option>
                <option value="person1">Person 1</option>
                <option value="person2">Person 2</option>
                <option value="person3">Person 3</option>
              </select>
            </div>
          </div>

          <div class="attachments-row my-1 mx-0">
            <label for="attachments" class="form-label">Attachments</label>

            <div class="input-group bg-light">
              <label
                class="input-group-text font-size"
                role="button"
                for="attachments"
              >
                <i class="bi bi-paperclip me-2"></i>Choose Files</label
              >
              <input id="attachments" type="file" class="d-none" multiple />

              <div
                id="files-status"
                class="form-control d-flex align-items-center gap-2 p-0"
              >
                <span class="flex-grow-1 text-muted border-1 m-2 text-truncate font-size">
                  No file chosen</span
                >
                <button
                  type="button"
                  id="files-clear"
                  class="btn-close ms-2 flex-shrink-0"
                  aria-label="Clear selected files"
                  disabled
                ></button>
              </div>
            </div>
          </div>
          <div class="row my-3 mx-0">
            <input typ="text" class="form-control" />
          </div>

          <div class="add-todo-btn-wrapper text-end">
            <button type="button" class="btn btn-primary rounded-1 font-size">
              + Add Todo
            </button>
          </div>
        </div>

        <div
          class="container-fluid mt-4 px-0 bg-white shadow-sm rounded-top-1 border border-2"
        >
          <div class="d-flex align-items-center px-2 py-2">
            <h2 class="fs-6 fw-semibold mb-0">Todos</h2>
            <div class="ms-auto d-flex align-items-center gap-0">
              <!-- Filter Button -->
              <button
                type="button"
                class="btn btn-outline-secondary btn-sm p-1"
                aria-label="Filter"
              >
                <svg
                  class="d-block"
                  width="14"
                  height="14"
                  viewBox="0 0 16 16"
                  fill="currentColor"
                  xmlns="http://www.w3.org/2000/svg"
                >
                  <path
                    d="M1 3.5A.5.5 0 0 1 1.5 3h13a.5.5 0 0 1 .38.824L10 9v3.5a.5.5 0 0 1-.276.447l-3 1.5A.5.5 0 0 1 6 14.5V9L1.12 3.824A.5.5 0 0 1 1 3.5z"
                  />
                </svg>
              </button>
              <!--Sort Button-->
              <button
                type="button"
                class="btn btn-outline-secondary btn-sm p-1"
                aria-label="Sort"
              >
                <svg
                  class="d-block"
                  width="14"
                  height="14"
                  viewBox="0 0 16 16"
                  fill="currentColor"
                  xmlns="http://www.w3.org/2000/svg"
                >
                  <path d="M3 4h10v1H3V4zm2 4h8v1H5V8zm3 4h5v1H8v-1z" />
                </svg>
              </button>
            </div>
          </div>
          <hr class="m-0" />

          <div class="border rounded-1 ps-2 mx-2 my-2 mb-5">
            <div class="d-flex pe-0 align-items-center">
              <h6 class="fw-semibold mb-1 fs-6 py-1">Example Todo</h6>
              <div
                class="ms-auto d-flex flex-column flex-sm-row align-items-end align-items-sm-center"
              >
                <span class="ms-auto text-muted font-size-ExToDo"
                  >Created: 2025/07/01</span
                >

                <div
                  class="btn-group mt-0 mt-sm-0"
                  role="group"
                  aria-label="Actions"
                >
                  <button
                    class="btn btn-outline-success btn-sm d-inline-flex align-items-center justify-content-center p-1 ms-1"
                    aria-label="Mark done"
                  >
                    <svg
                      class="d-block"
                      width="14"
                      height="14"
                      viewBox="0 0 16 16"
                      fill="currentColor"
                    >
                      <path
                        d="M13.485 1.929a1 1 0 0 1 0 1.414l-7.07 7.07-3.182-3.182a1 1 0 1 1 1.414-1.414l1.768 1.768 5.657-5.657a1 1 0 0 1 1.414 0z"
                      />
                    </svg>
                  </button>
                  <!-- Edit -->
                  <button
                    class="btn btn-outline-primary btn-sm d-inline-flex align-items-center justify-content-center p-1"
                    aria-label="Edit"
                  >
                    <svg
                      class="d-block"
                      width="14"
                      height="14"
                      viewBox="0 0 16 16"
                      fill="currentColor"
                    >
                      <path
                        d="M12.146.146a.5.5 0 0 1 .708 0l3 3a.5.5 0 0 1 0 .708l-8.5 8.5L5 12l.646-2.354 8.5-8.5zM4 13.5V16h2.5l7.146-7.146-2.5-2.5L4 13.5z"
                      />
                    </svg>
                  </button>
                  <!-- Delete -->
                  <button
                    class="btn btn-outline-danger btn-sm d-inline-flex align-items-center justify-content-center p-1"
                    aria-label="Delete"
                  >
                    <svg
                      class="d-block"
                      width="14"
                      height="14"
                      viewBox="0 0 16 16"
                      fill="currentColor"
                    >
                      <path
                        d="M5.5 5.5a.5.5 0 0 1 .5.5v7a.5.5 0 0 1-1 0v-7a.5.5 0 0 1 .5-.5zm3 .5a.5.5 0 0 1 1 0v7a.5.5 0 0 1-1 0v-7z"
                      />
                      <path
                        d="M14.5 3a1 1 0 0 1-1 1H13v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V4h-.5a1 1 0 1 1 0-2H6a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1h3.5a1 1 0 0 1 1 1zM4 4v9a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1V4H4z"
                      />
                    </svg>
                  </button>
                </div>
              </div>
            </div>
          

          <div class="description">
            <p class="mb-2 font-size-ExToDo">Description goes here</p>

            <div class="d-flex align-items-center font-size-ExToDo pb-2">
              <div class="d-flex align-items-center flex-wrap gap-2 pt-2">
                <span
                  class="d-inline-flex align-items-center gap-2 small text-muted"
                >
                  <svg
                    class="d-block"
                    width="16"
                    height="16"
                    viewBox="0 0 16 16"
                    fill="currentColor"
                    aria-hidden="true"
                  >
                    <path
                      d="M3 0a1 1 0 0 0-1 1v1H1.5A1.5 1.5 0 0 0 0 3.5v10A2.5 2.5 0 0 0 2.5 16h11A2.5 2.5 0 0 0 16 13.5v-10A1.5 1.5 0 0 0 14.5 2H14V1a1 1 0 0 0-2 0v1H4V1A1 1 0 0 0 3 0zm11.5 5H1v8.5A1.5 1.5 0 0 0 2.5 15h11a1.5 1.5 0 0 0 1.5-1.5V5z"
                    />
                  </svg>
                  <span>Due: 2025-07-10</span>
                </span>
                <span class="badge text-bg-info">John Doe</span>
                <span class="badge text-bg-secondary">2 attachments</span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </form>
  </body>
</html>
